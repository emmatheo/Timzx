[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"

# The deploy script writes deployments/<chainid>.json. Scoped to that one directory so a script
# cannot read a key file or write anywhere else in the repo.
fs_permissions = [{access = "read-write", path = "./deployments"}]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
